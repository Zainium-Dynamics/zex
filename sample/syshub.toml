# Zainium OS — Syshub Core Manifest
# Served at: archive.zainiumdynamics.tech/core/stable/syshub.toml
# Local:     /overlayer/syshub/engine/services/syshub.toml
#
# Schema v2.1:
#   + build_type  : "static" | "dynamic" | "firmware"
#   + libc_target : "relibc" | "musl" | "freestanding"
#   + provides    : includes linker sonames for libc packages
#
# No blake3/ed25519_sig here (v2.0 had blake3 per entry — removed).
# This ledger is an index, not a trust anchor: verification is fully
# embedded inside each .zex's own manifest.toml (blake3 + ed25519_sig +
# ed25519_pubkey, written by `substrate pack`), checked at install time
# against that same file. Nothing here needs to be trusted to verify a
# package — only used to find and download it.

