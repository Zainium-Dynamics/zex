#   + edition       : optional (Rust, GCC etc)
#
# No blake3/ed25519_sig here (v2.0 had both per entry — removed). This
# ledger is an index, not a trust anchor — it's how `zex search`/`install`
# find and download a package, nothing more. Verification is fully
# embedded inside each .zex's own manifest.toml (blake3 + ed25519_sig +
# ed25519_pubkey, written by `substrate pack` at build time — a fresh,
# ephemeral keypair per build, never persisted anywhere outside that one
# manifest), checked at install time against that same file — not against
# anything in this ledger.
#
# Parser reads: version, file, size_bytes, depends, provides,
#               requires_syshub, description, license, maintainer, tags,
#               build_type, libc_target, edition
# ============================================================

