libc_family      = "musl"  # all userland musl-linked via x86_64-zainium-linux-musl sysroot
# repo_pubkey removed: it modeled one fixed, persistent, ledger-wide
# signing identity — the opposite of the per-package ephemeral-key model
# above (fresh keypair per build, never persisted). There's no longer a
# mechanism that could produce a stable value for this field. If a
# separate, genuinely different concept (e.g. signing the ledger file
# itself, not individual packages) is wanted later, it needs its own
# field and its own key-management story — not this one.

