stages:
  - build
  - package
  - release

build:musl:
  stage: build
  image: rust:latest
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: cargo-musl
    paths:
      - .cargo/
      - target/
  before_script:
    - apt-get update -yq
    - apt-get install -yq musl-tools
    - rustup target add x86_64-unknown-linux-musl
  script:
    - cargo build --release --target x86_64-unknown-linux-musl
  artifacts:
    paths:
      - target/x86_64-unknown-linux-musl/release/zex
    expire_in: 1 week

# Only runs on a tag push — packs the built binary into
# zex-<tag>.tar.zst plus a .sha256 sidecar.
package:release:
  stage: package
  image: debian:stable-slim
  needs: ["build:musl"]
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apt-get update -yq
    - apt-get install -yq zstd
  script:
    - mkdir -p dist
    - tar -cf - -C target/x86_64-unknown-linux-musl/release zex | zstd -19 -o "dist/zex-${CI_COMMIT_TAG}.tar.zst"
    - sha256sum "dist/zex-${CI_COMMIT_TAG}.tar.zst" > "dist/zex-${CI_COMMIT_TAG}.tar.zst.sha256"
  artifacts:
    paths:
      - dist/
    expire_in: never

# Uploads the packaged archive + hash to the project's generic package
# registry, then creates a GitLab Release attached to the tag with both
# as downloadable assets.
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["package:release"]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/zex-${CI_COMMIT_TAG}.tar.zst" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zex/${CI_COMMIT_TAG}/zex-${CI_COMMIT_TAG}.tar.zst"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/zex-${CI_COMMIT_TAG}.tar.zst.sha256" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zex/${CI_COMMIT_TAG}/zex-${CI_COMMIT_TAG}.tar.zst.sha256"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'zex $CI_COMMIT_TAG'
    description: 'See CHANGELOG.md for what changed in this release.'
    assets:
      links:
        - name: 'zex-$CI_COMMIT_TAG.tar.zst'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zex/${CI_COMMIT_TAG}/zex-${CI_COMMIT_TAG}.tar.zst'
        - name: 'zex-$CI_COMMIT_TAG.tar.zst.sha256'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zex/${CI_COMMIT_TAG}/zex-${CI_COMMIT_TAG}.tar.zst.sha256'
