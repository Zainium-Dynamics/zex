[package]
name        = "zex"
version     = "6.0.0"
Licence     = "GPL 3-strict only"
description = "The Universal Executor & Package Manager for Zainium OS"
edition     = "2024"
authors     = ["Ali Zain <heyalizain@gmail.com>"]

[[bin]]
name = "zex"
path = "src/main.rs"

[lib]
name = "zex"
path = "src/lib.rs"

# ── All deps merged from 11 drivers 

[dependencies]
# Async runtime
tokio         = { version = "1",    features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "process", "fs", "time"] }
futures-util  = "0.3"
futures       = "0.3"

# CLI
clap          = { version = "4",    features = ["derive"] }
clap_complete = "4"

# Serialization
serde         = { version = "1",    features = ["derive"] }
serde_json    = "1"
toml          = "0.8"
plist         = "1.7"

# HTTP client (rustls — no OpenSSL/glibc)
reqwest       = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls        = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = "0.103"
webpki-roots  = "0.26"
bytes         = "1"

# Archive / compression
tar           = "0.4"
zstd          = "0.13"
# Native .zex compressor (magic ZEX1) — pack/unpack path for Tier-1 packages
zexc          = { version = "1.2.0", default-features = false, features = ["std", "simd"] }
flate2        = { version = "1",    default-features = false, features = ["rust_backend"] }
xz2           = "0.1"

# Filesystem
walkdir       = "2"
tempfile      = "3"

# Crypto
ed25519-dalek = { version = "2",    features = ["rand_core"] }
base64        = "0.22"
sha2          = { version = "0.10", features = ["oid"] }
sha1          = { version = "0.10", features = ["oid"] }
rsa           = "0.9"
blake3        = "1"
rand          = { version = "0.8", features = ["getrandom"] }
regex         = "1"
hex           = "0.4"

# Dependency resolution
pubgrub       = "0.2"

# Error handling
anyhow        = "1"
thiserror     = "1"

# Logging (log crate — relibc compatible, no tracing overhead)
log           = "0.4"

# Time
chrono        = { version = "0.4",  features = ["serde"] }

# Terminal UI
indicatif     = "0.17"

# System
libc          = "0.2"
nix           = { version = "0.29", features = ["user", "fs"] }
landlock      = "0.4"

# Misc
lazy_static   = "1"
quick-xml     = "0.36"

# ELF patching (T2/T3/T4 packages: rewrite PT_INTERP/RPATH for /overlayer)
oxipatch      = { git = "https://gitlab.com/alizain.arch/oxipatch.git", rev = "5a7e3ea3f219bf05ccfb126cd67fddcca1527aa0" }

[profile.release]
opt-level        = 3
lto              = "thin"
codegen-units    = 1
debug            = false
panic            = "abort"
strip            = "symbols"
overflow-checks  = true

[profile.dev]
opt-level = 0
debug     = true

# Runtime dep (for install lib crate compatibility)
[features]
default = []

[dev-dependencies]
tempfile   = "3"
serde_json = "1"
hex        = "0.4"
base64     = "0.22"
rand_core  = "0.6"
blake3     = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2       = "0.10"
tar        = "0.4"

[[bench]]
name = "hotpaths"
harness = false
